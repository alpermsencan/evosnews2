<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Arka Plan Radial Işık -->
    <radialGradient id="bgDark" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111c38"/>
      <stop offset="60%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Elektrik Mavi Gradyan -->
    <linearGradient id="eBlueGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Enerji Kıvılcım Gradyanı -->
    <linearGradient id="eBoltGrad" x1="200" y1="130" x2="310" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Neon Glow Filtresi -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#0ea5e9" flood-opacity="0.45"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Arka Plan (Sosyal Medya Yuvarlak Kırpmasına Tam Uyumlu) -->
  <rect width="512" height="512" fill="url(#bgDark)"/>

  <!-- Dış Dairesel Enerji Halkası -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 6"/>

  <!-- Merkez Kalkan / Rozet -->
  <g filter="url(#badgeShadow)">
    <rect x="96" y="96" width="320" height="320" rx="72" fill="#0b132b" stroke="#0ea5e9" stroke-width="5" stroke-opacity="0.8"/>
  </g>

  <!-- Elektrikli 'e' Yay Gövdesi -->
  <path
    d="M336 210C320 162 280 132 230 132C164 132 110 186 110 256C110 326 164 380 230 380C292 380 340 334 350 274H205"
    fill="none"
    stroke="url(#eBlueGrad)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- 'e' İçindeki Şimşek / Enerji Kıvılcımı -->
  <path
    d="M280 100L190 240H265L225 365L335 205H265L290 100Z"
    fill="url(#eBoltGrad)"
    filter="url(#neonGlow)"
  />

  <!-- LED Şarj Noktası -->
  <circle cx="360" cy="140" r="18" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="360" cy="140" r="8" fill="#ffffff"/>
</svg>
