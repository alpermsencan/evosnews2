<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Arka Plan Koyu Gece Gradyanı -->
    <radialGradient id="bgDark" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111c38"/>
      <stop offset="60%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Elektrik Mavisi Gradyan -->
    <linearGradient id="eBlueGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Neon Glow Filtresi -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0ea5e9" flood-opacity="0.45"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="512" height="512" fill="url(#bgDark)"/>

  <!-- Dış Dairesel Enerji Halkası (Sosyal Medya Yuvarlak Kırpmasına Tam Uyumlu) -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 6"/>

  <!-- Merkez Rozet / Kalkan Kutu -->
  <g filter="url(#badgeShadow)">
    <rect x="96" y="96" width="320" height="320" rx="76" fill="#0b132b" stroke="#0ea5e9" stroke-width="5" stroke-opacity="0.8"/>
  </g>

  <!-- Net, Kusursuz ve Güçlü Küçük 'e' Harfi (Lowercase "e" Anatomy) -->
  <path
    d="M152 268H360C360 192 316 140 252 140C180 140 132 196 132 268C132 340 180 396 252 396C308 396 348 364 360 312"
    fill="none"
    stroke="url(#eBlueGrad)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Canlı Şarj / Enerji LED Noktası -->
  <circle cx="384" cy="132" r="20" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="384" cy="132" r="9" fill="#ffffff"/>
</svg>
