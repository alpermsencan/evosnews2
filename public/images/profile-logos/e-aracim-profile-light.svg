<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Açık Arka Plan -->
    <radialGradient id="bgLight" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <linearGradient id="eGradLight" x1="300" y1="200" x2="724" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="1024" height="1024" fill="url(#bgLight)"/>

  <!-- Dış Dairesel Halka -->
  <circle cx="512" cy="512" r="472" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- Üst Amblem Kalkan (Merkez: 512, Y: 390) -->
  <g transform="translate(512, 390)" filter="url(#shadowLight)">
    <rect x="-195" y="-195" width="390" height="390" rx="92" fill="#0b132b" stroke="#0284c7" stroke-width="6"/>

    <!-- Net Küçük e Harfi (Lowercase "e") -->
    <path
      d="M-115 15H130C130 -75 80 -135 5 -135C-80 -135 -135 -70 -135 15C-135 100 -80 165 5 165C70 165 118 128 132 65"
      fill="none"
      stroke="url(#eGradLight)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Canlı Mavi Şarj LED -->
    <circle cx="160" cy="-145" r="22" fill="#38bdf8"/>
    <circle cx="160" cy="-145" r="10" fill="#ffffff"/>
  </g>

  <!-- Alt Kısım: e-aracim.com Kalın Kurumsal Yazı -->
  <g transform="translate(512, 735)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-1">
      <tspan fill="#0284c7">e-</tspan><tspan fill="#0f172a">aracim</tspan><tspan fill="#0284c7" font-size="68" font-weight="800">.com</tspan>
    </text>
  </g>
</svg>
