<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Açık Arka Plan -->
    <radialGradient id="bgLight" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <!-- Elektrik Mavi Gradyan -->
    <linearGradient id="eBlueLight" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="badgeShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="512" height="512" fill="url(#bgLight)"/>

  <!-- Dış Halka -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Merkez Kalkan Rozet -->
  <g filter="url(#badgeShadowLight)">
    <rect x="96" y="96" width="320" height="320" rx="76" fill="#0b132b" stroke="#0284c7" stroke-width="4.5"/>
  </g>

  <!-- Net, Kusursuz ve Güçlü Küçük 'e' Harfi (Lowercase "e") -->
  <path
    d="M152 268H360C360 192 316 140 252 140C180 140 132 196 132 268C132 340 180 396 252 396C308 396 348 364 360 312"
    fill="none"
    stroke="url(#eBlueLight)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Canlı Şarj Noktası -->
  <circle cx="384" cy="132" r="18" fill="#38bdf8"/>
  <circle cx="384" cy="132" r="8" fill="#ffffff"/>
</svg>
